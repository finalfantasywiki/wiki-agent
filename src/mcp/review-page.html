<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Fandom serves a placeholder for images hotlinked with another site's Referer. -->
<meta name="referrer" content="no-referrer">
<title>Manifest review</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: var(--color-background-primary, #ffffff);
    --bg-soft: var(--color-background-secondary, #f5f5f4);
    --fg: var(--color-text-primary, #1c1917);
    --muted: var(--color-text-secondary, #57534e);
    --border: var(--color-border-primary, #d6d3d1);
    --accent: var(--color-text-info, #1d4ed8);
    --bad: var(--color-text-danger, #b91c1c);
    --good: var(--color-text-success, #15803d);
    --warn: var(--color-text-warning, #a16207);
    font-family: var(--font-sans, system-ui, -apple-system, sans-serif);
    font-size: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: var(--color-background-primary, #1c1917);
      --bg-soft: var(--color-background-secondary, #292524);
      --fg: var(--color-text-primary, #f5f5f4);
      --muted: var(--color-text-secondary, #a8a29e);
      --border: var(--color-border-primary, #44403c);
      --accent: var(--color-text-info, #93c5fd);
      --bad: var(--color-text-danger, #fca5a5);
      --good: var(--color-text-success, #86efac);
      --warn: var(--color-text-warning, #fcd34d);
    }
  }
  :root[data-theme="dark"] {
    --bg: var(--color-background-primary, #1c1917);
    --bg-soft: var(--color-background-secondary, #292524);
    --fg: var(--color-text-primary, #f5f5f4);
    --muted: var(--color-text-secondary, #a8a29e);
    --border: var(--color-border-primary, #44403c);
    --accent: var(--color-text-info, #93c5fd);
    --bad: var(--color-text-danger, #fca5a5);
    --good: var(--color-text-success, #86efac);
    --warn: var(--color-text-warning, #fcd34d);
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px 16px 24px; background: var(--bg); color: var(--fg); line-height: 1.4; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  h2 { font-size: 14px; margin: 20px 0 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .muted { color: var(--muted); }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
  .status { color: var(--muted); }
  .status.error { color: var(--bad); }
  button { font: inherit; padding: 4px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-soft); color: var(--fg); cursor: pointer; }
  button.primary { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  button:disabled { opacity: 0.5; cursor: default; }
  input[type="text"] { font: inherit; padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg); min-width: 0; flex: 1 1 200px; }
  table { border-collapse: collapse; }
  td, th { padding: 2px 10px 2px 0; text-align: left; }
  th { font-weight: 600; }
  a { color: var(--accent); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
  .card { border: 1px solid var(--border); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .cards.wide { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .card.blocked { border-color: var(--bad); }
  .card img { width: 100%; height: 120px; object-fit: contain; background: var(--bg-soft); border-radius: 4px; }
  .card .title { overflow-wrap: anywhere; }
  .question { border: 1px solid var(--border); border-radius: 8px; padding: 8px; display: flex; gap: 10px; margin-bottom: 8px; }
  .question img { width: 96px; height: 96px; object-fit: contain; background: var(--bg-soft); border-radius: 4px; flex: none; }
  .question .body { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1; }
  .answered { color: var(--good); }
  .error { color: var(--bad); }
  .warn { color: var(--warn); }
  .question .title { overflow-wrap: anywhere; }
  summary { cursor: pointer; color: var(--muted); }
  label.check { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--bg-soft); padding: 6px; border-radius: 4px; margin: 4px 0 0; font-size: 12px; }
  ul.plain { padding-left: 18px; margin: 4px 0; }
</style>
</head>
<body>
<main id="root"><p class="muted">Loading the manifest…</p></main>
<!-- review-app.ts puts the bundled review-page.tsx here. -->
<script type="module" src="review-page.tsx"></script>
</body>
</html>
